<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon set. The original declared type="image/svg+xml" while pointing
      at a .png, a mismatch some browsers reject outright.

      Order matters: browsers that understand SVG icons take the first one and
      get a mark that stays crisp at any size; everything else falls back to
      the multi-resolution .ico.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Goofy Tube — browse popular and top-rated movies and TV shows, and watch trailers."
    />
    <meta name="theme-color" content="#0d0d10" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <!--
      Loaded via <link> rather than an @import inside index.css. A CSS @import
      creates a render-blocking request chain: the browser must download and
      parse the stylesheet before it even discovers the font request.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap"
    />
    <title>Goofy Tube</title>
    <!--
      Critical boot-loader positioning, inlined.

      The loader's real styles live in index.css, which arrives after first
      paint. Until then the div was a static block sitting inside the UA's
      default body margin, and it jumped to inset:0 the moment the stylesheet
      applied — a ~0.44 layout shift on every single page load, which by
      itself put the page in the "poor" CLS band. Fixing it here costs a few
      bytes and removes the shift entirely.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #050507;
      }
      #loader.loader-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0d10;
      }
    </style>
  </head>
  <body>
    <!--
      Boot loader. It covers the gap between first paint and React mounting.
      Ownership is single: src/main.jsx calls hideBootLoader() once the app
      has rendered. Nothing else removes it.
    -->
    <div id="loader" class="loader-screen">
      <div class="loader-content">
        <div class="film-spinner">
          <div class="reel-circle"></div>
          <div class="reel-circle"></div>
          <div class="reel-circle"></div>
          <div class="reel-hole"></div>
        </div>
        <p class="loading-text">Loading GoofyTube...</p>
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
